    subfamily: freefall
    backend: source_mujoco
    supported_embodiments: [no_robot]
    task_variants: [nominal_freefall, lateral_freefall]
    rates: {simulation_hz: [600, 1200], control_hz: 60, video_hz: 30}
    evaluator: passive_freeflight_v1
    required_metadata: [release_state, object_properties, surfaces, source_hashes]
    release_state: blocked
    blockers: [rigid_profile_not_calibrated, six_review_rollouts_pending]
