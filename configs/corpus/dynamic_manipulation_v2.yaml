schema_version: dynamic-robot-corpus-registry/v1
contract_version: dynamic-robot-dataset/v2
registry_id: unified_dynamic_manipulation_20_v1
leaf_count: 20
canonical_media:
  width: 832
  height: 480
  video_hz: 30
  cameras: [main, secondary]
release_policy:
  activation_is_per_leaf: true
  fixed_review_rollouts: 6
  blocked_leaf_quota: 0
  legacy_assisted_counts_toward_generated_hours: false
