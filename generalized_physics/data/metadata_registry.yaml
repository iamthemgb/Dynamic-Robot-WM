# Controlled metadata registry (plan: Module A + appendix fragment).
# Property keys, canonical semantic scopes, and unit descriptors form closed
# vocabularies; raw simulator entity IDs (body_17, geom_3, ...) must never
# appear here or in episode records.
version: 2

scopes:
  - global
  - robot
  - robot_link
  - primary_object
  - secondary_object
  - support_surface
  - joint
  - material
  - primary_object--support_surface
  - primary_object--secondary_object

units:
  - m_per_s2
  - kg
  - dimensionless
  - newton
  - canonical_sim_unit
  - m
  - m_per_s
  - s
  - newton_second        # v2: contact impulse (f1_10h)

properties:
  gravity_z:
    transform: identity
    unit: m_per_s2
    allowed_scopes: [global]
  mass:
    transform: log
    unit: kg
    allowed_scopes: [primary_object, secondary_object, robot_link]
  restitution:
    transform: logit_clipped
    unit: dimensionless
    allowed_scopes: [primary_object--support_surface,
                     primary_object--secondary_object]
  dynamic_friction:
    transform: log
    unit: dimensionless
    allowed_scopes: [primary_object--support_surface]
  static_friction:
    transform: log
    unit: dimensionless
    allowed_scopes: [primary_object--support_surface]
  actuator_scale:
    transform: log
    unit: dimensionless
    allowed_scopes: [robot]
  bending_stiffness:
    transform: log
    unit: canonical_sim_unit
    allowed_scopes: [material, primary_object]

  # -- projectile ball-catch dataset (wan_projectile_smoke_cache) ---------
  # Cached values are already field-transformed (log10 mass/speed etc.), so
  # every key uses the identity transform; whitening reuses the cache's
  # norm_stats.json mean/std, keeping codes bit-identical to prior runs.
  log10_ball_mass:
    transform: identity
    unit: canonical_sim_unit
    allowed_scopes: [primary_object]
  ball_radius:
    transform: identity
    unit: m
    allowed_scopes: [primary_object]
  p0_cam_x:
    transform: identity
    unit: m
    allowed_scopes: [primary_object]
  p0_cam_y:
    transform: identity
    unit: m
    allowed_scopes: [primary_object]
  p0_cam_z:
    transform: identity
    unit: m
    allowed_scopes: [primary_object]
  v0_cam_x:
    transform: identity
    unit: m_per_s
    allowed_scopes: [primary_object]
  v0_cam_y:
    transform: identity
    unit: m_per_s
    allowed_scopes: [primary_object]
  v0_cam_z:
    transform: identity
    unit: m_per_s
    allowed_scopes: [primary_object]
  log10_speed:
    transform: identity
    unit: canonical_sim_unit
    allowed_scopes: [primary_object]
  icpt_cam_x:
    transform: identity
    unit: m
    allowed_scopes: [global]
  icpt_cam_y:
    transform: identity
    unit: m
    allowed_scopes: [global]
  icpt_cam_z:
    transform: identity
    unit: m
    allowed_scopes: [global]
  ballistic_intercept_time_s:
    transform: identity
    unit: s
    allowed_scopes: [global]
  gripper_close_time:
    transform: identity
    unit: s
    allowed_scopes: [robot]

  # -- v3: projectile-catch state-groups dataset (pbc_state_groups) -------
  # Conditioning = the sibling's initial-condition bundle: the 14 projectile
  # keys above (camera-frame state, intended catch target, planned close
  # time) plus these three. All are action-PLAN quantities fixed before the
  # rollout; realized outcomes never enter records.
  release_time_s:
    transform: identity
    unit: s
    allowed_scopes: [global]
  controller_hold_home:          # wrong_action branch: arm stays at home
    transform: identity
    unit: dimensionless
    allowed_scopes: [robot]
  grasp_capture_enabled:         # success branch: grasp-capture weld active
    transform: identity
    unit: dimensionless
    allowed_scopes: [robot]

  # -- v2: f1_10h falling-catch corpus (mzl7/f1_10h) ----------------------
  # The 14 keys above are reused verbatim. These seven cover what actually
  # VARIES in f1_10h: the intrinsic material constants are near-degenerate
  # there (gravity identical across all episodes, object mass spans 6% and is
  # constant for half of them, radius spans 2%), so the identifiable physics
  # is the scene initial condition, the embodiment, and the contact outcome.
  # Values are raw SI here -- MetadataNormalizer whitens them from train-split
  # statistics -- so transforms are real rather than identity.
  key_event_time_s:
    transform: identity
    unit: s
    allowed_scopes: [global]
  intercept_offset_m:          # |ballistic intercept - grasp centre| in xy;
    transform: identity        # the single most catch-predictive scalar
    unit: m
    allowed_scopes: [global]
  tool_is_parallel_pad:        # embodiment indicator (robotiq vs franka hand)
    transform: identity
    unit: dimensionless
    allowed_scopes: [robot]
  impact_speed:
    transform: log
    unit: m_per_s
    allowed_scopes: [primary_object--secondary_object]
  impact_normal_impulse:
    transform: log
    unit: newton_second
    allowed_scopes: [primary_object--secondary_object]
  max_penetration_depth:
    transform: identity
    unit: m
    allowed_scopes: [primary_object--secondary_object]
  contact_duration:
    transform: identity
    unit: s
    allowed_scopes: [primary_object--secondary_object]

  # -- rbi: rolling-ball interception (zl664/rolling_ball_velocity_4k_v1) --
  # Robot-base-frame initial ball velocity, the only per-episode variation
  # the phase-1 conditioning question asks about (the 2x2 action plans are
  # deliberately NOT records: within every velocity pair the plan is
  # identical, and the action pathway trains in a separate stage).
  # NOTE: appending keys grows RecordEmbedder's key table (n_keys), so
  # phase-1 checkpoints written BEFORE this block will not strict-load for
  # future re-runs; append-only ordering keeps old key ids stable, so the
  # remedy would be a 2-row zero-pad of embed.key.weight.
  v0_robot_x:
    transform: identity
    unit: m_per_s
    allowed_scopes: [primary_object]
  v0_robot_y:
    transform: identity
    unit: m_per_s
    allowed_scopes: [primary_object]
