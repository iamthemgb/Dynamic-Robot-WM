# Generalized Phase-1 oracle training test on the real projectile dataset.
# Same cache / splits / fixtures / flow convention as the two prior smoke
# arms; 500 steps is a TRAINING TEST (loss trajectories + paired eval), not
# the full 2k-step smoke budget.
out_dir: /gpfs/radev/home/mzl7/scratch/wan_generalized_runs/projectile_phase1
cache_dir: /gpfs/radev/home/mzl7/scratch/wan_projectile_smoke_cache
model_dir: /gpfs/radev/scratch/sous/mzl7/wan_models/Wan2.1-T2V-1.3B

# architecture (generalized plan defaults)
belief_dim: 64
k_tokens: 8
d_phys: 256
projector_hidden: 256
n_adapters: 4            # quarter-depth on the 30-block DiT -> [3, 11, 18, 26]
adapter_heads: 4
lora_rank: 16
lora_alpha: 16.0
lora_dropout: 0.05
lora_targets: [q, v]     # self- AND cross-attention projections, all blocks

# Phase-1 losses: L_FM + 0.2 L_meta.  The plan's eq.-19 rank hinge is NOT
# optimized (circular with the paired-eval gap used as the learning gate);
# it is monitored instead: every rank_monitor_interval steps the wrong-code
# loss is recomputed under no_grad and rank_gap = L_FM(wrong)-L_FM(correct)
# is logged.
w_fm: 1.0
w_meta: 0.2
rank_monitor_interval: 10
p_null: 0.10             # learned null code batches
p_noise: 0.10            # small belief-space code noise
noise_scale: 0.1

# optimization (plan hyperparameters; gate bootstrap from the proven recipe)
shift: 5.0
batch_size: 1
grad_accum: 8
lr_teacher: 3.0e-4
lr_adapters: 1.0e-4      # projector + adapters + LoRA
gate_lr_mult: 10.0
weight_decay: 0.01
grad_clip: 1.0
max_steps: 500
warmup_steps: 100
seed: 0

# logging / eval (frozen fixtures shared with both prior arms)
log_interval: 10
eval_interval: 250
ckpt_interval: 100       # eval-free checkpoint so 6h devel sessions resume
subset_stride: 3         # 100 of 300 val episodes per eval
eval_batch_size: 8
u_grid: [0.25, 0.5, 0.75, 0.9]
noise_seed: 1234
bootstrap_iters: 2000
